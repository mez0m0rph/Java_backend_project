spring:
  application:
    name: team-task-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
app:
  security:
    jwt-secret: ${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
